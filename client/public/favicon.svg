<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00332e"/>
      <stop offset="100%" stop-color="#001c19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1be6e"/>
      <stop offset="100%" stop-color="#d1a154"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#d1a154" stroke-width="2" filter="url(#glow)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Clinical Medical Cross -->
  <g fill="url(#goldGrad)">
    <!-- Vertical bar -->
    <rect x="27" y="16" width="10" height="32" rx="3"/>
    <!-- Horizontal bar -->
    <rect x="16" y="27" width="32" height="10" rx="3"/>
  </g>

  <!-- Center Accent -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>